name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: gfortran
            version: latest
          # Pinned: LFortran 0.66.0 regressed sequential stdin reads (see
          # the README guard note); stay on 0.65.x until that's fixed
          # upstream. Supported by fortran-lang/setup-fortran's table.
          - compiler: lfortran
            version: "0.65.0"
          - compiler: flang
            version: latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup Fortran
        uses: fortran-lang/setup-fortran@v2.0.0-beta.10
        with:
          compiler: ${{ matrix.compiler }}
          version: ${{ matrix.version }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install web dependencies
        run: npm ci

      - name: Build (gfortran)
        if: matrix.compiler == 'gfortran'
        run: gfortran src/adventure.f src/adventure_shims.f -o adventure

      - name: Build (lfortran)
        if: matrix.compiler == 'lfortran'
        run: |
          mkdir -p build
          cat src/adventure.f src/adventure_shims.f > build/adventure_all.f
          lfortran --fixed-form --implicit-interface --implicit-typing build/adventure_all.f -o adventure

      - name: Build (flang)
        if: matrix.compiler == 'flang'
        run: flang src/adventure.f src/adventure_shims.f -o adventure

      - name: Smoke test
        run: |
          printf "Y\nLOOK\n" | timeout 10 ./adventure | tee output.txt
          grep -q "WELCOME TO ADVENTURE" output.txt
          grep -q "YOU ARE STANDING AT THE END OF A ROAD" output.txt

      - name: Smoke test (movement into the building)
        run: |
          printf "Y\nIN\n" | timeout 10 ./adventure | tee move_output.txt
          grep -q "YOU ARE INSIDE A BUILDING" move_output.txt

      - name: Regression suite (native)
        env:
          ADVENTURE_NATIVE: ./adventure
        run: node scripts/run-tests.mjs --native-only

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install web dependencies
        run: npm ci

      - name: Lint JavaScript sources
        run: npm run lint

      - name: Typecheck @ts-check sources (strict)
        run: scripts/typecheck.sh

      - name: Browser smoke tests (launcher gestures + boot guard)
        run: scripts/browser-smoke.sh

      - name: Mobile layout (headless Chrome)
        run: node --test scripts/mobile-layout.test.mjs

      - name: WASM smoke test (committed artifacts)
        run: |
          node scripts/headless-test.mjs web/adventure.js Y LOOK | tee output.txt
          grep -q "WELCOME TO ADVENTURE" output.txt
          grep -q "YOU ARE STANDING AT THE END OF A ROAD" output.txt

      - name: WASM smoke test (committed artifacts, movement)
        run: |
          node scripts/headless-test.mjs web/adventure.js Y IN | tee move_output.txt
          grep -q "YOU ARE INSIDE A BUILDING" move_output.txt

  build-wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup LFortran
        uses: fortran-lang/setup-fortran@v2.0.0-beta.10
        with:
          compiler: lfortran
          # Pinned: 0.66.0 regressed sequential stdin reads on the wasm
          # target (see the README guard note); the deploy bundle is built
          # with this toolchain, so it must stay on 0.65.x too.
          version: "0.65.0"

      - name: Setup Emscripten
        uses: emscripten-core/setup-emsdk@v16

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install web dependencies
        run: npm ci

      - name: Build WebAssembly
        env:
          EMCC: ${{ env.EMSDK }}/upstream/emscripten/emcc
        run: scripts/build-web.sh

      - name: WASM smoke test
        run: |
          node scripts/headless-test.mjs web/adventure.js Y LOOK | tee output.txt
          grep -q "WELCOME TO ADVENTURE" output.txt
          grep -q "YOU ARE STANDING AT THE END OF A ROAD" output.txt

      - name: WASM smoke test (movement into the building)
        run: |
          node scripts/headless-test.mjs web/adventure.js Y IN | tee move_output.txt
          grep -q "YOU ARE INSIDE A BUILDING" move_output.txt

      - name: Install gfortran (native parity reference)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gfortran

      - name: WASM regression suite (with native parity)
        run: node scripts/run-tests.mjs

      - name: Verify deploy bundle
        run: |
          ESBUILD=node_modules/.bin/esbuild scripts/bundle-web.sh --out dist
          node scripts/check-bundle.test.mjs dist

      - name: Upload WASM artifacts
        uses: actions/upload-artifact@v7
        with:
          name: wasm-build
          path: |
            web/adventure.js
            web/adventure.wasm
          if-no-files-found: error

  deploy-pages:
    needs: build-wasm
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7

      - name: Download WASM artifacts
        uses: actions/download-artifact@v8
        with:
          name: wasm-build
          path: web

      # GH Pages caches every file with a fixed max-age=600. Deploying the
      # modular web/ sources lets a reload mix a cached entry module with
      # fresh siblings, which kills the module graph ("Importing binding
      # name ... is not found") before the launcher can report anything.
      # bundle-web.sh collapses the graphs into single-file bundles with a
      # build-id query, so each page load is atomically one deploy.
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install web dependencies
        run: npm ci

      - name: Bundle web deploy
        run: |
          ESBUILD=node_modules/.bin/esbuild scripts/bundle-web.sh --out dist

      - name: Verify final deploy bundle
        run: node scripts/check-bundle.test.mjs dist

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
